<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Temporal Trivia</title>
  <style>
    :root { --ink:#111827; --paper:#f4f1e8; --red:#ef4444; --blue:#22a8e0; --green:#35c56d; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:var(--ink); color:var(--paper); font-family:Inter,ui-rounded,system-ui,sans-serif; }
    header { display:flex; align-items:center; justify-content:space-between; padding:24px 36px; border-bottom:4px solid var(--paper); }
    h1 { margin:0; font-size:clamp(28px,4vw,54px); letter-spacing:-.04em; }
    #timer { min-width:150px; padding:10px 18px; border:4px solid var(--paper); border-radius:999px; text-align:center; font:900 38px/1 ui-monospace,monospace; }
    main { display:grid; grid-template-columns:minmax(0,1.5fr) minmax(320px,.8fr); gap:24px; padding:24px 36px 36px; }
    .card { border:4px solid var(--paper); border-radius:22px; padding:22px; background:#1c2637; box-shadow:8px 8px 0 var(--blue); }
    .spotlight { min-height:310px; display:flex; flex-direction:column; justify-content:center; }
    .eyebrow { margin:0 0 10px; color:#9ce5ff; font-weight:900; letter-spacing:.12em; text-transform:uppercase; }
    #question { margin:0; font-size:clamp(28px,4vw,58px); line-height:1.04; }
    #answer { margin:22px 0 0; font-size:clamp(24px,3vw,44px); color:#facc15; }
    #answeredBy { margin:12px 0 0; font-size:24px; font-weight:800; }
    .stats { display:grid; grid-template-columns:repeat(2,1fr); gap:14px; margin-top:24px; }
    .stat { border:3px solid var(--paper); border-radius:16px; padding:14px; text-align:center; }
    .stat strong { display:block; font-size:38px; }
    h2 { margin:0 0 14px; font-size:24px; }
    #leaderboard { display:grid; gap:9px; }
    .player { display:grid; grid-template-columns:1fr auto; gap:12px; padding:11px 14px; border:2px solid #64748b; border-radius:12px; font-weight:850; }
    .player:first-child { border-color:#facc15; background:#3c3516; }
    #events { margin:22px 0 0; padding:0; list-style:none; color:#cbd5e1; font-family:ui-monospace,monospace; }
    #events li { padding:5px 0; border-top:1px solid #475569; }
    #start { width:100%; margin-top:20px; padding:18px; border:0; border-radius:999px; background:var(--red); color:white; font:900 24px/1 system-ui; box-shadow:0 7px 0 #991b1b; cursor:pointer; }
    #start:disabled { opacity:.45; cursor:not-allowed; }
    #winners { display:none; margin:18px 0 0; padding:16px; border-radius:16px; background:#facc15; color:#111827; font-size:30px; font-weight:950; text-align:center; }
    @media (max-width:850px) { main{grid-template-columns:1fr;padding:18px} header{padding:18px} }
  </style>
</head>
<body>
  <header><h1>Temporal Trivia</h1><div id="timer">1:00</div></header>
  <main>
    <section>
      <div class="card spotlight">
        <p class="eyebrow">Newest answer</p>
        <h2 id="question">Badges are waiting for work.</h2>
        <p id="answer">Start a 60-second round.</p>
        <p id="answeredBy"></p>
        <div id="winners"></div>
      </div>
      <div class="stats">
        <div class="stat"><strong id="completed">0</strong>completed</div>
        <div class="stat"><strong id="players">0</strong>badges</div>
      </div>
    </section>
    <aside class="card">
      <h2>Leaderboard</h2>
      <div id="leaderboard"><div class="player"><span>Waiting for badges</span><b>0</b></div></div>
      <button id="start">START GAME</button>
      <ul id="events"></ul>
    </aside>
  </main>
  <script>
    let state = {status:'waiting', players:{}, events:[]};
    const el = id => document.getElementById(id);
    function render(next) {
      state = next;
      const players = Object.values(next.players || {}).sort((a,b) => b.score-a.score || a.callsign.localeCompare(b.callsign));
      el('players').textContent = players.length;
      el('completed').textContent = next.completed_questions || 0;
      el('leaderboard').replaceChildren(...(players.length ? players : [{callsign:'Waiting for badges',score:0}]).map(p => {
        const row=document.createElement('div'); row.className='player';
        const name=document.createElement('span'); name.textContent=p.callsign;
        const score=document.createElement('b'); score.textContent=p.score;
        row.append(name,score); return row;
      }));
      el('events').replaceChildren(...(next.events || []).slice().reverse().map(text => {
        const item=document.createElement('li'); item.textContent=text; return item;
      }));
      if (next.latest_answer) {
        const a=next.latest_answer;
        el('question').textContent=a.question;
        el('answer').textContent=`Answer: ${a.correct_answer}`;
        el('answeredBy').textContent=`${a.callsign} — ${a.was_correct ? 'CORRECT' : 'WRONG'} — score ${a.score}`;
      }
      const finished=next.status==='finished';
      el('start').disabled=next.status==='running';
      el('start').textContent=finished?'NEW GAME':'START GAME';
      el('winners').style.display=finished?'block':'none';
      el('winners').textContent=finished ? (next.winners.length ? `WINNER${next.winners.length>1?'S':''}: ${next.winners.join(' + ')}` : 'ROUND COMPLETE') : '';
    }
    function tick() {
      let seconds=60;
      if (state.deadline_unix_ms) seconds=Math.max(0,Math.ceil((state.deadline_unix_ms-Date.now())/1000));
      el('timer').textContent=`${Math.floor(seconds/60)}:${String(seconds%60).padStart(2,'0')}`;
    }
    el('start').addEventListener('click', async () => {
      el('start').disabled=true;
      const response=await fetch('/api/start',{method:'POST',headers:{'content-type':'application/json'},body:'{}'});
      if (!response.ok) { alert(await response.text()); el('start').disabled=false; return; }
      render(await response.json());
    });
    fetch('/api/state').then(r=>r.json()).then(render);
    new EventSource('/api/events').onmessage=event=>render(JSON.parse(event.data));
    setInterval(tick,100);
  </script>
</body>
</html>
