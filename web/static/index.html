    :root {
      color-scheme: dark;
      --substrate: #080a09;
      --substrate-deep: #020303;
      --gold: #cfb06c;
      --gold-dim: #75633d;
      --gold-faint: rgba(207,176,108,.16);
      --silk: #edece6;
      --silk-dim: #8c8d88;
      --fault: #d45b52;
    }
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }
    body {
      display: grid;
      place-items: center;
      color: var(--silk);
      font-family: "Space Grotesk", sans-serif;
    }
    button { color: inherit; font: inherit; }
    .stage {
      position: relative;
      width: min(100vw, 177.7777778vh);
      height: min(100vh, 56.25vw);
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      isolation: isolate;
      container-type: size;
      background:
        radial-gradient(circle at 10% 19%, rgba(207,176,108,.05) 0 .15cqw, transparent .19cqw),
        radial-gradient(circle at 91% 80%, rgba(207,176,108,.07) 0 .12cqw, transparent .16cqw),
        linear-gradient(135deg, var(--substrate-deep), var(--substrate) 48%, #050706);
      box-shadow: 0 0 0 1px #171916;
    }
    .stage::before {
      content: "";
      position: absolute;
      z-index: 0;
      inset: 2.8%;
      pointer-events: none;
      border: .08cqw solid rgba(207,176,108,.34);
      clip-path: polygon(0 0, 14% 0, 14% 1.5%, 86% 1.5%, 86% 0, 100% 0, 100% 100%, 83% 100%, 83% 98.5%, 17% 98.5%, 17% 100%, 0 100%);
    }
    .silk-fragment {
      position: absolute;
      z-index: 0;
      overflow: hidden;
      opacity: .23;
      pointer-events: none;
    }
    .silk-fragment img {
      position: absolute;
      display: block;
      width: 34cqw;
      height: auto;
      filter: grayscale(1) sepia(.35);
    }
    .silk-a { top: -2cqh; right: -1.5cqw; width: 21cqw; height: 26cqh; }
    .silk-a img { top: -1cqh; right: -6cqw; }
    .silk-b { left: -2cqw; bottom: -2cqh; width: 19cqw; height: 29cqh; transform: rotate(180deg); }
    .silk-b img { left: -8cqw; bottom: -5cqh; }
    .trace {
      position: absolute;
      z-index: 0;
      height: .1cqw;
      background: var(--gold-dim);
      opacity: .62;
      pointer-events: none;
    }
    .trace::before, .trace::after {
      content: "";
      position: absolute;
      top: 50%;
      width: .52cqw;
      aspect-ratio: 1;
      border: .08cqw solid var(--gold);
      border-radius: 50%;
      background: var(--substrate);
      transform: translateY(-50%);
    }
    .trace::before { left: -.28cqw; }
    .trace::after { right: -.28cqw; }
    .trace-one { left: 3.2cqw; top: 21cqh; width: 17cqw; transform: rotate(-19deg); }
    .trace-two { right: 3cqw; bottom: 18cqh; width: 14cqw; transform: rotate(28deg); }
    .header {
      position: absolute;
      z-index: 2;
      top: 5.5cqh;
      left: 6.3cqw;
      right: 6.3cqw;
      height: 17cqh;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: start;
      border-bottom: .08cqw solid rgba(237,236,230,.46);
    }
    .title {
      margin: .8cqh 0 0;
      font-size: 3.25cqh;
      line-height: 1;
      font-weight: 650;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .title small {
      display: block;
      margin-top: 1.15cqh;
      color: var(--gold);
      font-family: "Space Mono", monospace;
      font-size: 1.05cqh;
      font-weight: 400;
      letter-spacing: .24em;
    }
    .timer {
      align-self: center;
      min-width: 4.1em;
      margin-top: -.5cqh;
      color: var(--silk);
      font-family: "Space Grotesk", sans-serif;
      font-size: 10.4cqh;
      font-variant-numeric: tabular-nums;
      font-weight: 520;
      line-height: .9;
      letter-spacing: -.075em;
      text-align: center;
    }
    .timer.urgent { color: var(--fault); }
    .ref {
      justify-self: end;
      margin-top: .9cqh;
      color: var(--silk-dim);
      font-family: "Space Mono", monospace;
      font-size: 1.05cqh;
      letter-spacing: .16em;
      text-align: right;
      text-transform: uppercase;
    }
    .ref::before {
      content: "";
      display: inline-block;
      width: 1.8cqw;
      height: .45cqh;
      margin-right: .7cqw;
      border-top: .08cqw solid var(--gold);
      border-bottom: .08cqw solid var(--gold);
      vertical-align: .15em;
    }
    .lanes {
      --rows: 1;
      position: absolute;
      z-index: 2;
      top: 26cqh;
      left: 8cqw;
      right: 8cqw;
      bottom: 7.5cqh;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: repeat(var(--rows), minmax(0, 1fr));
      grid-auto-flow: column;
      gap: 1.2cqh 6cqw;
      min-height: 0;
      transition: left 280ms ease, right 280ms ease;
    }
    .lanes.two-columns {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .lane {
      position: relative;
      min-width: 0;
      display: grid;
      grid-template-columns: 7.5cqw minmax(0,1fr) 13cqw;
      align-items: center;
      border-top: .08cqw solid rgba(237,236,230,.38);
      border-bottom: .08cqw solid rgba(207,176,108,.28);
      background: linear-gradient(90deg, rgba(207,176,108,.035), transparent 35%);
      transition: transform 280ms ease;
    }
    .two-columns .lane {
      grid-template-columns: 4.3cqw minmax(0,1fr) 7.2cqw;
    }
    .lane::before, .lane::after {
      content: "";
      position: absolute;
      width: .52cqw;
      aspect-ratio: 1;
      border: .08cqw solid var(--gold);
      border-radius: 50%;
      background: var(--substrate);
    }
    .lane::before { left: -.27cqw; top: -.31cqw; }
    .lane::after { right: -.27cqw; bottom: -.31cqw; }
    .lane.placeholder { opacity: .31; }
    .rank {
      color: var(--gold);
      font-family: "Space Mono", monospace;
      font-size: min(2.45cqh, calc(8.8cqh / var(--rows)));
      font-variant-numeric: tabular-nums;
      letter-spacing: .04em;
    }
    .identity {
      min-width: 0;
      padding-left: 1.4cqw;
      border-left: .08cqw solid rgba(207,176,108,.34);
    }
    .callsign {
      overflow: hidden;
      color: var(--silk);
      font-family: "Space Mono", monospace;
      font-size: min(3.15cqh, calc(12cqh / var(--rows)));
      line-height: 1.05;
      letter-spacing: .055em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .worker-state {
      display: block;
      margin-top: .75cqh;
      color: var(--silk-dim);
      font-family: "Space Mono", monospace;
      font-size: min(1.35cqh, calc(5.3cqh / var(--rows)));
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    .lane.fault .worker-state { color: var(--fault); }
    .score {
      justify-self: end;
      min-width: 2.2ch;
      font-family: "Space Grotesk", sans-serif;
      font-size: min(8.5cqh, calc(31cqh / var(--rows)));
      font-variant-numeric: tabular-nums;
      font-weight: 500;
      line-height: .8;
      letter-spacing: -.06em;
      text-align: right;
      transition: color 120ms linear, text-shadow 120ms linear;
    }
    .score.flash {
      color: var(--gold);
      text-shadow: 0 0 1.2cqw rgba(207,176,108,.62);
    }
    .winner-tag {
      position: absolute;
      top: 50%;
      right: 14.4cqw;
      padding: .5cqh .75cqw;
      border: .08cqw solid var(--gold);
      color: var(--gold);
      background: var(--substrate);
      font-family: "Space Mono", monospace;
      font-size: min(1.25cqh, calc(4.8cqh / var(--rows)));
      letter-spacing: .16em;
      text-transform: uppercase;
      transform: translateY(-50%);
    }
    .two-columns .winner-tag { right: 8.2cqw; }
    .ceremony {
      position: absolute;
      z-index: 3;
      inset: 23cqh 6cqw 5cqh;
      display: none;
      pointer-events: none;
    }
    .stage.waiting .ceremony { display: block; }
    .astronaut-window {
      position: absolute;
      left: 34cqw;
      top: 1cqh;
      width: 20cqw;
      height: 37cqh;
      overflow: hidden;
      opacity: .26;
    }
    .astronaut-window img {
      display: block;
      width: 20cqw;
      height: auto;
      transform: translateY(-1.4cqh);
      filter: saturate(.7);
    }
    .stage.has-players .astronaut-window {
      left: 1cqw;
      width: 13cqw;
      height: 26cqh;
      opacity: .16;
    }
    .stage.has-players .astronaut-window img { width: 13cqw; }
    .start-pad {
      position: absolute;
      left: 50%;
      bottom: 1cqh;
      min-width: 22cqw;
      height: 8.5cqh;
      padding: 0 3.2cqw;
      border: .18cqw solid var(--gold);
      border-radius: 999px;
      color: var(--substrate-deep);
      background: var(--gold);
      font-family: "Space Mono", monospace;
      font-size: 1.8cqh;
      font-weight: 700;
      letter-spacing: .2em;
      text-transform: uppercase;
      cursor: pointer;
      pointer-events: auto;
      transform: translateX(-50%);
      box-shadow: inset 0 0 0 .42cqw var(--substrate), inset 0 0 0 .58cqw var(--gold);
    }
    .start-pad::before, .start-pad::after {
      content: "";
      position: absolute;
      top: 50%;
      width: .65cqw;
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--substrate);
      transform: translateY(-50%);
    }
    .start-pad::before { left: 1.3cqw; }
    .start-pad::after { right: 1.3cqw; }
    .start-pad:disabled { opacity: .45; cursor: progress; }
    .stage.finished .ceremony { display: block; }
    .stage.finished .astronaut-window {
      left: auto;
      right: 1cqw;
      top: -18cqh;
      width: 13cqw;
      height: 20cqh;
      opacity: .15;
    }
    .stage.finished .astronaut-window img { width: 13cqw; }
    .stage.finished .start-pad {
      min-width: 17cqw;
      height: 5.4cqh;
      bottom: .15cqh;
      font-size: 1.2cqh;
      background: var(--substrate);
      color: var(--gold);
      box-shadow: none;
    }
    .stage.running .ceremony { display: none; }
    .stage.waiting .lanes { bottom: 16cqh; }
    .stage.finished .lanes { bottom: 11cqh; }
    .stage.running .title small,
    .stage.running .ref { visibility: hidden; }
    .operator-pad {
      position: absolute;
      z-index: 8;
      right: 2.2cqw;
      bottom: 2.4cqh;
      width: 1.6cqw;
      aspect-ratio: 1;
      padding: 0;
      border: .08cqw solid var(--gold-dim);
      border-radius: 50%;
      color: var(--gold-dim);
      background: transparent;
      font-family: "Space Mono", monospace;
      font-size: .55cqw;
      cursor: pointer;
    }
    .operator-pad:hover, .operator-pad[aria-expanded="true"] {
      color: var(--substrate);
      background: var(--gold);
    }
    .drawer {
      position: absolute;
      z-index: 20;
      top: 4cqh;
      right: 3cqw;
      bottom: 4cqh;
      width: 38cqw;
      display: none;
      overflow: hidden;
      border: .08cqw solid var(--gold);
      background: #090b0a;
      box-shadow: 0 0 0 .38cqw #090b0a, 0 0 0 .46cqw rgba(207,176,108,.35);
    }
    .drawer.open { display: grid; grid-template-rows: auto auto minmax(0,1fr); }
    .drawer-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2.2cqh 2cqw 1.8cqh;
      border-bottom: .08cqw solid var(--gold-dim);
    }
    .drawer-head h2 {
      margin: 0;
      font-size: 2.7cqh;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .drawer-close {
      width: 2.2cqw;
      aspect-ratio: 1;
      padding: 0;
      border: .08cqw solid var(--silk-dim);
      background: transparent;
      font-family: "Space Mono", monospace;
      font-size: 1.8cqh;
      cursor: pointer;
    }
    .tabs { display: grid; grid-template-columns: 1fr 1fr; }
    .tab {
      padding: 1.4cqh;
      border: 0;
      border-bottom: .08cqw solid var(--gold-dim);
      color: var(--silk-dim);
      background: transparent;
      font-family: "Space Mono", monospace;
      font-size: 1.15cqh;
      letter-spacing: .16em;
      text-transform: uppercase;
      cursor: pointer;
    }
    .tab + .tab { border-left: .08cqw solid var(--gold-dim); }
    .tab.active { color: var(--substrate); background: var(--gold); }
    .panel {
      display: none;
      min-height: 0;
      padding: 2cqh 2cqw;
      overflow: auto;
    }
    .panel.active { display: block; }
    .control-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1cqh .7cqw; }
    .control {
      min-height: 8cqh;
      padding: 1.1cqh .9cqw;
      border: .08cqw solid var(--silk-dim);
      color: var(--silk);
      background: transparent;
      text-align: left;
      cursor: pointer;
    }
    .control:hover:not(:disabled) { border-color: var(--gold); color: var(--gold); }
    .control:disabled { opacity: .28; cursor: default; }
    .control strong, .control small { display: block; }
    .control strong { font-size: 1.55cqh; }
    .control small {
      margin-top: .7cqh;
      color: var(--silk-dim);
      font-family: "Space Mono", monospace;
      font-size: .9cqh;
      line-height: 1.4;
    }
    .crash-control {
      width: 100%;
      min-height: 6cqh;
      margin-top: 1.3cqh;
      border-color: var(--fault);
      color: var(--fault);
      text-align: center;
      text-transform: uppercase;
    }
    .operator-note {
      margin: 1.5cqh 0 0;
      color: var(--silk-dim);
      font-family: "Space Mono", monospace;
      font-size: .92cqh;
      line-height: 1.55;
    }
    .history-list { display: grid; gap: 1cqh; }
    .round {
      display: grid;
      grid-template-columns: minmax(0,1fr) auto;
      gap: .7cqh 1cqw;
      padding: 1.2cqh 1cqw;
      border-left: .14cqw solid var(--gold);
      background: var(--gold-faint);
    }
    .round strong {
      overflow: hidden;
      font-family: "Space Mono", monospace;
      font-size: 1.25cqh;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .round time, .round small {
      color: var(--silk-dim);
      font-family: "Space Mono", monospace;
      font-size: .9cqh;
    }
    .round small { grid-column: 1 / -1; line-height: 1.5; }
    .offline {
      position: absolute;
      z-index: 40;
      inset: 0;
      display: none;
      place-items: center;
      background: rgba(2,3,3,.93);
    }
    .offline.visible { display: grid; }
    .offline-card {
      position: relative;
      width: 56cqw;
      padding: 5.5cqh 5cqw 5cqh;
      border-top: .12cqw solid var(--fault);
      border-bottom: .12cqw solid var(--fault);
      text-align: center;
    }
    .offline.recovered .offline-card {
      border-color: var(--gold);
    }
    .offline.recovered .offline-card::before,
    .offline.recovered .offline-card::after {
      border-color: var(--gold);
    }
    .offline-card::before, .offline-card::after {
      content: "";
      position: absolute;
      top: -.38cqw;
      width: .65cqw;
      aspect-ratio: 1;
      border: .09cqw solid var(--fault);
      border-radius: 50%;
      background: var(--substrate);
    }
    .offline-card::before { left: 0; }
    .offline-card::after { right: 0; }
    .offline strong {
      display: block;
      color: var(--fault);
      font-size: 5.1cqh;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .offline.recovered strong { color: var(--gold); }
    .recovery-steps {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.2cqw;
      margin-top: 3.4cqh;
    }
    .recovery-step {
      position: relative;
      padding-top: 1.6cqh;
      border-top: .08cqw solid rgba(242, 237, 161, .18);
      color: rgba(242, 237, 161, .36);
      font-family: "Space Mono", monospace;
      font-size: 1.05cqh;
      letter-spacing: .08em;
      line-height: 1.35;
      text-transform: uppercase;
    }
    .recovery-step::before {
      content: "";
      position: absolute;
      top: -.34cqw;
      left: 50%;
      width: .55cqw;
      aspect-ratio: 1;
      border: .08cqw solid currentColor;
      border-radius: 50%;
      background: var(--substrate);
      transform: translateX(-50%);
    }
    .recovery-step.done,
    .recovery-step.active {
      border-color: var(--gold);
      color: var(--gold);
    }
    .recovery-step.done::before { background: var(--gold); }
    .recovery-step.active::before {
      box-shadow: 0 0 0 .22cqw rgba(203, 180, 132, .13);
    }
    .recovery-detail {
      display: block;
      margin-top: 2.2cqh;
      color: var(--silk);
      font-family: "Space Mono", monospace;
      font-size: 1.55cqh;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .toast {
      position: absolute;
      z-index: 30;
      left: 50%;
      bottom: 4cqh;
      display: none;
      max-width: 62cqw;
      padding: 1.3cqh 1.5cqw;
      border: .08cqw solid var(--fault);
      color: var(--fault);
      background: var(--substrate);
      font-family: "Space Mono", monospace;
      font-size: 1.1cqh;
      text-align: center;
      transform: translateX(-50%);
    }
    .toast.visible { display: block; }
    @media (max-aspect-ratio: 4/3) {
      .stage { width: 100vw; height: 56.25vw; }
    }
    @media (prefers-reduced-motion: reduce) {
      .lanes, .lane, .score { transition: none; }
    }
  </style>
</head>

      <button class="start-pad" id="start" type="button">Start round</button>
    </section>

    <button class="operator-pad" id="operatorToggle" type="button" aria-label="Open operator controls" aria-expanded="false">TP7</button>

    <aside class="drawer" id="operatorDrawer" aria-label="Operator controls">
      <div class="drawer-head">
        <h2>Operator</h2>
        <button class="drawer-close" id="drawerClose" type="button" aria-label="Close operator controls">×</button>
      </div>
      <div class="tabs" role="tablist">
        <button class="tab active" id="chaosTab" type="button" role="tab" aria-selected="true" data-panel="chaosPanel">Chaos</button>
        <button class="tab" id="historyTab" type="button" role="tab" aria-selected="false" data-panel="historyPanel">History</button>
      </div>
      <section class="panel active" id="chaosPanel" role="tabpanel" aria-labelledby="chaosTab">
        <div class="control-grid">
          <button class="control" type="button" data-chaos="double-points"><strong>Double points</strong><small>Signal // 10 seconds</small></button>
          <button class="control" type="button" data-chaos="rust-only"><strong>Rust only</strong><small>Signal // 10 seconds</small></button>
          <button class="control" type="button" data-chaos="sudden-death"><strong>Sudden death</strong><small>Next correct answer wins</small></button>
          <button class="control" type="button" data-chaos="extend"><strong>+30 seconds</strong><small>Extend durable timer once</small></button>
        </div>
        <button class="control crash-control" id="crashMac" type="button">Crash the Mac Worker</button>
        <p class="operator-note" id="chaosStatus">Signals are durable Workflow events.</p>
      </section>
      <section class="panel" id="historyPanel" role="tabpanel" aria-labelledby="historyTab">
        <div class="history-list" id="historyList"><div class="round"><strong>Loading Visibility…</strong></div></div>
      </section>
    </aside>

    <div class="offline" id="offline" role="status" aria-live="assertive">
      <div class="offline-card">
        <strong id="recoveryTitle">Mac Worker stopped</strong>
        <div class="recovery-steps" aria-label="Worker recovery progress">
          <span class="recovery-step active">Worker<br>stopped</span>
          <span class="recovery-step">Supervisor<br>restart</span>
          <span class="recovery-step">Temporal<br>reconnect</span>
          <span class="recovery-step">History<br>restored</span>
        </div>
        <span class="recovery-detail" id="recoveryDetail">Temporal is holding the game state</span>
      </div>
    </div>
    <div class="toast" id="toast" role="alert"></div>
  </div>

  <script>
    let state = {status: 'waiting', players: {}, winners: [], chaos: {}};
    let activeGameId = null;
    let laneOrder = [];
    let previousScores = new Map();
    let eventSource;
    let toastTimer;
    let recoveryActive = false;
    let recoveryTimers = [];

    const el = id => document.getElementById(id);

    function orderedPlayers(snapshot) {
      const incoming = Object.values(snapshot.players || {});
      const incomingIds = new Set(incoming.map(player => player.badge_id));
      laneOrder = laneOrder.filter(id => incomingIds.has(id));
      for (const player of incoming) {
        if (!laneOrder.includes(player.badge_id)) laneOrder.push(player.badge_id);
      }
      const byId = new Map(incoming.map(player => [player.badge_id, player]));
      return laneOrder.map(id => byId.get(id)).filter(Boolean).slice(0, 10);
    }

    function rankPlayers(players) {
      const sorted = [...players].sort((left, right) =>
        right.score - left.score || left.callsign.localeCompare(right.callsign)
      );
      const ranks = new Map();
      let lastScore;
      let lastRank = 0;
      sorted.forEach((player, index) => {
        if (player.score !== lastScore) lastRank = index + 1;
        ranks.set(player.badge_id, lastRank);
        lastScore = player.score;
      });
      return ranks;
    }

    function workerState(player, snapshot) {
      const retry = snapshot.latest_reassignment;
      if (retry?.from_callsign === player.callsign) return ['Reassigned after fault', true];
      if (retry?.to_callsign === player.callsign) return ['Retry active', false];
      if (snapshot.status === 'running') return ['Worker active', false];
      if (snapshot.status === 'finished') return ['Round held', false];
      return ['Polling task queue', false];
    }

    function laneNode(player, rank, snapshot, placeholder = false) {
      const row = document.createElement('article');
      row.className = 'lane' + (placeholder ? ' placeholder' : '');
      if (!placeholder) row.dataset.badgeId = player.badge_id;
      const rankNode = document.createElement('span');
      rankNode.className = 'rank';
      rankNode.textContent = placeholder ? '--' : String(rank).padStart(2, '0');
      const identity = document.createElement('span');
      identity.className = 'identity';
      const callsign = document.createElement('span');
      callsign.className = 'callsign';
      callsign.textContent = placeholder ? 'AWAITING BADGE' : player.callsign;
      const worker = document.createElement('span');
      worker.className = 'worker-state';
      const [workerText, fault] = placeholder ? ['Unpowered', false] : workerState(player, snapshot);
      worker.textContent = workerText;
      if (fault) row.classList.add('fault');
      identity.append(callsign, worker);
      const score = document.createElement('strong');
      score.className = 'score';
      score.textContent = placeholder ? '00' : String(player.score).padStart(2, '0');
      if (!placeholder && previousScores.has(player.badge_id) && previousScores.get(player.badge_id) !== player.score) {
        score.classList.add('flash');
        setTimeout(() => score.classList.remove('flash'), 420);
      }
      if (!placeholder && snapshot.status === 'finished' && (snapshot.winners || []).includes(player.callsign)) {
        const winner = document.createElement('span');
        winner.className = 'winner-tag';
        winner.textContent = snapshot.winners.length > 1 ? 'Tied winner' : 'Winner';
        row.append(winner);
      }
      row.append(rankNode, identity, score);
      return row;
    }

    function render(snapshot) {
      const gameId = snapshot.game_id || null;
      if (gameId !== activeGameId) {
        activeGameId = gameId;
        laneOrder = [];
        previousScores = new Map();
      }
      state = snapshot;
      const stage = el('stage');
      stage.classList.remove('waiting', 'running', 'finished');
      stage.classList.add(snapshot.status || 'waiting');

      const players = orderedPlayers(snapshot);
      stage.classList.toggle('has-players', players.length > 0);
      const ranks = rankPlayers(players);
      const visiblePlayers = [...players];
      const placeholders = snapshot.status === 'waiting' ? Math.max(0, 5 - visiblePlayers.length) : 0;
      const totalLanes = visiblePlayers.length + placeholders;
      const twoColumns = totalLanes > 5;
      const rows = Math.max(1, Math.ceil(totalLanes / (twoColumns ? 2 : 1)));
      const lanes = el('lanes');
      const previousLaneCount = lanes.children.length;
      const previousRects = new Map(
        [...lanes.querySelectorAll('[data-badge-id]')].map(node => [node.dataset.badgeId, node.getBoundingClientRect()])
      );
      lanes.classList.toggle('two-columns', twoColumns);
      lanes.style.setProperty('--rows', rows);
      const nodes = visiblePlayers.map(player => laneNode(player, ranks.get(player.badge_id), snapshot));
      for (let slot = 0; slot < placeholders; slot += 1) {
        nodes.push(laneNode({}, 0, snapshot, true));
      }
      lanes.replaceChildren(...nodes);
      if (previousLaneCount !== totalLanes) {
        for (const node of lanes.querySelectorAll('[data-badge-id]')) {
          const previous = previousRects.get(node.dataset.badgeId);
          if (!previous) continue;
          const current = node.getBoundingClientRect();
          node.style.transition = 'none';
          node.style.transform = 'translate(' + (previous.left - current.left) + 'px,' + (previous.top - current.top) + 'px)';
          requestAnimationFrame(() => requestAnimationFrame(() => {
            node.style.transition = '';
            node.style.transform = '';
          }));
        }
      }

      previousScores = new Map(players.map(player => [player.badge_id, player.score]));
      el('start').textContent = snapshot.status === 'finished' ? 'New round' : 'Start round';
      el('start').disabled = snapshot.status === 'running';
      el('roundRef').textContent =
        snapshot.status === 'running' ? 'Race live' :
        snapshot.status === 'finished' ? 'Result frozen' :
        players.length ? 'Workers armed' : 'Awaiting workers';

      const now = Date.now();
      const activeChaos = [];
      if ((snapshot.chaos?.double_points_until_unix_ms || 0) > now) activeChaos.push('2× points');
      if ((snapshot.chaos?.rust_only_until_unix_ms || 0) > now) activeChaos.push('Rust only');
      if (snapshot.chaos?.sudden_death) activeChaos.push('Sudden death');
      el('chaosStatus').textContent = activeChaos.length
        ? 'ACTIVE // ' + activeChaos.join(' // ')
        : 'Signals are durable Workflow events.';

      document.querySelectorAll('[data-chaos]').forEach(button => {
        button.disabled =
          snapshot.status !== 'running' ||
          (button.dataset.chaos === 'extend' && snapshot.chaos?.extension_used) ||
          (button.dataset.chaos === 'sudden-death' && snapshot.chaos?.sudden_death);
      });
    }

    function tick() {
      let seconds = 60;
      if (state.deadline_unix_ms) {
        seconds = Math.max(0, Math.ceil((state.deadline_unix_ms - Date.now()) / 1000));
      }
      const timer = el('timer');
      timer.textContent = Math.floor(seconds / 60) + ':' + String(seconds % 60).padStart(2, '0');
      timer.classList.toggle('urgent', state.status === 'running' && seconds <= 10);
    }

    function setRecoveryStage(stage, disconnected = false) {
      const overlay = el('offline');
      const titles = disconnected
        ? ['Connection lost', 'Supervisor restarting', 'Connecting to Temporal', 'Worker recovered']
        : ['Mac Worker crashed', 'Supervisor restarting', 'Connecting to Temporal', 'Worker recovered'];
      const details = [
        'Temporal is holding the game state',
        'Starting a new Rust Worker process',
        'Waiting for the Worker to reconnect',
        'Workflow History replayed // race state restored'
      ];
      el('recoveryTitle').textContent = titles[stage];
      el('recoveryDetail').textContent = details[stage];
      overlay.classList.toggle('recovered', stage === 3);
      overlay.querySelectorAll('.recovery-step').forEach((step, index) => {
        step.classList.toggle('done', index < stage);
        step.classList.toggle('active', index === stage);
      });
    }

    function beginRecovery(disconnected = false) {
      if (recoveryActive) return;
      recoveryActive = true;
      recoveryTimers.forEach(clearTimeout);
      recoveryTimers = [];
      el('offline').classList.add('visible');
      setRecoveryStage(0, disconnected);
      recoveryTimers.push(setTimeout(() => setRecoveryStage(1, disconnected), 500));
      recoveryTimers.push(setTimeout(() => setRecoveryStage(2, disconnected), 1800));
    }

    function completeRecovery() {
      if (!recoveryActive) return;
      recoveryTimers.forEach(clearTimeout);
      recoveryTimers = [];
      setRecoveryStage(3);
      recoveryTimers.push(setTimeout(() => {
        el('offline').classList.remove('visible', 'recovered');
        recoveryActive = false;
      }, 2500));
    }

    function showError(message) {
      const toast = el('toast');
      toast.textContent = message;
      toast.classList.add('visible');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('visible'), 5000);
    }

    async function refreshState() {
      const response = await fetch('/api/state');
      if (!response.ok) throw new Error(await response.text());
      render(await response.json());
    }

    function connectEvents() {
      eventSource?.close();
      eventSource = new EventSource('/api/events');
      eventSource.onopen = async () => {
        try {
          await refreshState();
          completeRecovery();
        } catch (error) {
          beginRecovery(true);
          showError(error.message);
        }
      };
      eventSource.onmessage = event => render(JSON.parse(event.data));
      eventSource.onerror = () => beginRecovery(true);
    }

    function openDrawer() {
      el('operatorDrawer').classList.add('open');
      el('operatorToggle').setAttribute('aria-expanded', 'true');
    }

    function closeDrawer() {
      el('operatorDrawer').classList.remove('open');
      el('operatorToggle').setAttribute('aria-expanded', 'false');
    }

    async function loadHistory() {
      const list = el('historyList');
      list.innerHTML = '<div class="round"><strong>Loading Visibility…</strong></div>';
      try {
        const response = await fetch('/api/history');
        if (!response.ok) throw new Error(await response.text());
        const rounds = await response.json();
        if (!rounds.length) {
          list.innerHTML = '<div class="round"><strong>No indexed rounds yet</strong></div>';
          return;
        }
        list.replaceChildren(...rounds.map(round => {
          const row = document.createElement('div');
          row.className = 'round';
          const winner = document.createElement('strong');
          winner.textContent = round.winners?.length ? round.winners.join(' + ') : 'No winner';
          const time = document.createElement('time');
          time.textContent = round.closed_unix_ms ? new Date(round.closed_unix_ms).toLocaleTimeString() : '—';
          const stats = document.createElement('small');
          stats.textContent =
            round.badge_count + ' BADGES // ' +
            round.correct_answers + ' CORRECT // ' +
            round.wrong_answers + ' RETRIED // ' +
            round.crashes + ' CRASHES // ' +
            round.reassignments + ' HANDOFFS';
          row.append(winner, time, stats);
          return row;
        }));
      } catch (error) {
        list.innerHTML = '';
        const row = document.createElement('div');
        row.className = 'round';
        row.textContent = error.message;
        list.append(row);
      }
    }

    el('start').addEventListener('click', async () => {
      el('start').disabled = true;
      try {
        const response = await fetch('/api/start', {
          method: 'POST',
          headers: {'content-type': 'application/json'},
          body: '{}'
        });
        if (!response.ok) throw new Error(await response.text());
        render(await response.json());
      } catch (error) {
        showError(error.message);
        el('start').disabled = false;
      }
    });

    document.querySelectorAll('[data-chaos]').forEach(button => {
      button.addEventListener('click', async () => {
        button.disabled = true;
        try {
          const response = await fetch('/api/chaos/' + button.dataset.chaos, {method: 'POST'});
          if (!response.ok) throw new Error(await response.text());
          await refreshState();
        } catch (error) {
          showError(error.message);
          button.disabled = false;
        }
      });
    });

    el('crashMac').addEventListener('click', async () => {
      try {
        const response = await fetch('/api/crash-worker', {method: 'POST'});
        if (!response.ok) throw new Error(await response.text());
        closeDrawer();
        beginRecovery(false);
      } catch (error) {
        showError(error.message);
      }
    });

    el('operatorToggle').addEventListener('click', () => {
      if (el('operatorDrawer').classList.contains('open')) closeDrawer();
      else openDrawer();
    });
    el('drawerClose').addEventListener('click', closeDrawer);
    document.addEventListener('keydown', event => {
      if (event.key.toLowerCase() === 'o' && !event.metaKey && !event.ctrlKey) {
        if (el('operatorDrawer').classList.contains('open')) closeDrawer();
        else openDrawer();
      }
      if (event.key === 'Escape') closeDrawer();
    });
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(candidate => {
          const active = candidate === tab;
          candidate.classList.toggle('active', active);
          candidate.setAttribute('aria-selected', String(active));
        });
        document.querySelectorAll('.panel').forEach(panel => {
          panel.classList.toggle('active', panel.id === tab.dataset.panel);
        });
        if (tab.dataset.panel === 'historyPanel') loadHistory();
      });
    });

    refreshState()
      .then(() => {
        el('offline').classList.remove('visible');
        connectEvents();
      })
      .catch(() => {
        beginRecovery(true);
        connectEvents();
      });
    tick();
    setInterval(tick, 100);
  </script>
</body>
</html>
